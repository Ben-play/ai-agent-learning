# Optional HTTP transport; no lock or runtime verification in this workspace.
[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "course-deployment-http-lab"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools]
py-modules = []
