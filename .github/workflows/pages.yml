name: Deploy course to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - assets/**
      - best-practices/**
      - code/phase1-python/phase1-practices-capstone/README.md
      - code/phase2-model-selection/phase2-practices-capstone/README.md
      - lessons/**
      - qa/**
      - reference/**
      - scripts/build-pages.py
      - .nojekyll
      - 404.html
      - index.html
      - manifest.webmanifest
      - offline.html
      - service-worker.js
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build allowlisted site
        shell: bash
        run: |
          python --version
          python scripts/build-pages.py \
            --output "$RUNNER_TEMP/pages-site" \
            --site-root "${{ steps.pages.outputs.base_path }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
