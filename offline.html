<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F8F6F1">
  <title>当前处于离线状态 · AI Agent 学习路径</title>
  <style>
    :root { color-scheme:light dark; font-family:"Songti SC",STSong,Georgia,serif; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:1.5rem; color:#203126; background:#f6f2e8; }
    main { width:min(100%,39rem); padding:clamp(2rem,7vw,4.5rem); border:1px solid #d8d1c3; border-radius:1.2rem 1.2rem 3.5rem 1.2rem; background:#fffdf8; box-shadow:0 1.6rem 5rem rgba(32,49,38,.12); }
    .mark { display:grid; place-items:center; width:4.4rem; height:4.4rem; margin-bottom:2.2rem; border-radius:50%; color:#fff; background:#173525; font:700 1.2rem ui-monospace,monospace; box-shadow:0 0 0 .6rem #e8e3d8; }
    h1 { margin:0 0 .8rem; font-size:clamp(2rem,8vw,3.4rem); line-height:1.12; color:#173525; }
    p { margin:0 0 1.8rem; color:#625d55; font:1rem/1.8 system-ui,sans-serif; }
    nav { display:flex; flex-wrap:wrap; gap:.75rem; }
    a,button { display:inline-flex; align-items:center; min-height:2.8rem; padding:.65rem 1rem; border:1px solid #173525; border-radius:999px; color:#173525; background:transparent; font:650 .9rem system-ui,sans-serif; text-decoration:none; cursor:pointer; }
    a:first-child { color:#fff; background:#173525; }
    @media (prefers-color-scheme:dark) { body{color:#ece9e2;background:#151918} main{border-color:#343a36;background:#202522;box-shadow:none} .mark{color:#142118;background:#8ee0b2;box-shadow:0 0 0 .6rem #29342e} h1{color:#a5ecc4} p{color:#bbb6ad} a,button{color:#a5ecc4;border-color:#73b991} a:first-child{color:#142118;background:#8ee0b2} }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">OFF</div>
    <h1>网络暂时离线</h1>
    <p>这个页面尚未保存在设备上。可以返回课程首页，或重试当前页面；曾访问并缓存的课程仍可离线打开。</p>
    <nav aria-label="离线操作">
      <a id="home-link" href="./" data-site-root="__SITE_ROOT__">返回课程首页</a>
      <button type="button" onclick="location.reload()">重新加载</button>
    </nav>
  </main>
  <script>
    (function () {
      var link = document.getElementById('home-link');
      var root = link.getAttribute('data-site-root');
      if (root && root.charAt(0) === '/') link.href = root;
    })();
  </script>
</body>
</html>
